[librenms]
user = bsd
group = bsd
listen = 127.0.0.1:9000
listen.owner = bsd
listen.group = bsd

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 5

php_admin_value[error_log] = /var/log/librenms/php-fpm-error.log
php_admin_flag[log_errors] = on

; Required by LibreNMS
php_value[session.save_path] = /var/lib/php/sessions

; Pass container env vars through to PHP (clear_env=yes by default strips them)
env[LIBRENMS_USER] = bsd
