name: librenms

x-daemonless:
  title: "LibreNMS"
  icon: ":material-network:"
  category: "Monitoring"
  description: "LibreNMS is an autodiscovering PHP/MySQL/SNMP based network monitoring which includes support for a wide range of network hardware and operating systems including Cisco, Linux, FreeBSD, Juniper, Brocade, Foundry, HP and many more."
  upstream_url: "https://www.librenms.org"
  web_url: "https://www.librenms.org"
  freshports_url: "https://www.freshports.org/net-mgmt/librenms/"
  user: "bsd"
  mlock: false
  community: "Discord:https://discord.gg/Kb9tkhecZT"

  # Which service goes where when this stack is put on a network. LibreNMS is
  # the one people open; its database is not, and putting it on the LAN
  # because the app was put there is how MariaDB ends up reachable from the
  # rest of the network.
  networking:
    librenms: default
    "*": private

  # How the database is FOUND once the two no longer share the host's network
  # stack: fjord sets DB_HOST to the database service's name, and container DNS
  # resolves it on the network they share.
  hostnames:
    librenms-mariadb: DB_HOST

  notes: |
    **Networking:** both services ship on `network_mode: host`, and LibreNMS
    reaches MariaDB at `127.0.0.1`. MariaDB then listens on the host's port 3306,
    so set strong passwords. Installed through fjord onto a network, the
    database moves to the stack's own private network instead and is found by
    name (`DB_HOST`).

    ## First login

    Set `ADMIN_USER` and `ADMIN_PASSWORD` and the admin account is created on
    first start. LibreNMS refuses passwords that appear in known data leaks; if
    that happens the container log says so -- pick another and restart.

  docs:
    env:
      PUID: "User ID for the application process"
      PGID: "Group ID for the application process"
      TZ: "Timezone for the container"
      DB_HOST:
        desc: "Where LibreNMS finds MariaDB (fjord sets this; 127.0.0.1 on host networking)"
        level: advanced
      DB_PORT: "MariaDB port"
      DB_DATABASE: "Database name"
      DB_USERNAME: "Database user"
      DB_PASSWORD: "Password for the librenms database user"
      MYSQL_ROOT_PASSWORD:
        desc: "MariaDB root password (the database password unless set)"
        level: advanced
      ADMIN_USER: "LibreNMS admin account, created on first start"
      ADMIN_PASSWORD: "Password for that admin account"
      APP_URL: "Address you open LibreNMS at, e.g. http://192.168.1.10:8080 (used in links it sends)"
      CONFIG_LOCATION: "Host folder for LibreNMS data: settings, RRD files, logs"
      DB_DATA_LOCATION: "Host folder for the MariaDB data"
    volumes:
      /config: "Persistent data: .env, RRD files, logs, storage"
    ports:
      8080: "Web UI"

services:
  librenms:
    image: ghcr.io/daemonless/librenms:latest
    container_name: librenms
    network_mode: host
    restart: always
    depends_on:
      - librenms-mariadb
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-UTC}
      # 127.0.0.1 on host networking; fjord sets the database's name when it
      # puts the stack on a network (x-daemonless.hostnames).
      - DB_HOST=${DB_HOST:-127.0.0.1}
      - DB_PORT=3306
      - DB_DATABASE=librenms
      - DB_USERNAME=librenms
      - DB_PASSWORD=${DB_PASSWORD}
      - ADMIN_USER=${ADMIN_USER}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      # Optional: the address LibreNMS puts in the links it sends (alerts).
      - APP_URL=${APP_URL:-}
    volumes:
      - ${CONFIG_LOCATION}:/config
    # Ignored on host networking; used when fjord puts the stack on a bridge.
    ports:
      - 8080:8080

  librenms-mariadb:
    image: ghcr.io/daemonless/mariadb:latest
    container_name: librenms-mariadb
    network_mode: host
    restart: always
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-UTC}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-${DB_PASSWORD}}
      - MYSQL_DATABASE=librenms
      - MYSQL_USER=librenms
      - MYSQL_PASSWORD=${DB_PASSWORD}
    volumes:
      - ${DB_DATA_LOCATION}:/config
